{% extends "base.html" %}
{% block title %}Добавить лицензию{% endblock %}
{% block content %}
<h2>🔑 Добавить лицензию ПО</h2>
<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="mb-3"><label>Название ПО *</label><input type="text" name="software_name" class="form-control" required></div>
            <div class="mb-3"><label>Лицензионный ключ</label><input type="text" name="license_key" class="form-control"></div>
            <div class="mb-3"><label>Дата окончания *</label><input type="date" name="expiration_date" class="form-control" required></div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{{ url_for('view_equipment', equipment_id=equipment[0]) }}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
