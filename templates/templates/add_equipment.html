{% extends "base.html" %}

{% block title %}Добавить оборудование{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="fas fa-plus"></i> Добавление оборудования</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Инвентарный номер *</label>
                        <input type="text" name="inventory_number" class="form-control" required placeholder="ИН-011">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Наименование *</label>
                        <input type="text" name="name" class="form-control" required placeholder="Системный блок Dell">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Тип оборудования</label>
                        <select name="type_id" class="form-select">
                            <option value="">Выберите тип...</option>
                            {% for t in types %}
                            <option value="{{ t[0] }}">{{ t[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Серийный номер</label>
                        <input type="text" name="serial_number" class="form-control" placeholder="SN123456789">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Местоположение</label>
                        <input type="text" name="location" class="form-control" placeholder="Каб. 101">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Статус</label>
                        <select name="status" class="form-select">
                            <option value="in_stock">На складе</option>
                            <option value="in_use">В эксплуатации</option>
                            <option value="repair">В ремонте</option>
                        </select>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Сохранить</button>
                        <a href="{{ url_for('equipment_list') }}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
