{% extends "base.html" %}

{% block title %}Редактирование оборудования{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0"><i class="fas fa-edit"></i> Редактирование оборудования</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Инвентарный номер *</label>
                        <input type="text" name="inventory_number" class="form-control" value="{{ equipment[1] }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Наименование *</label>
                        <input type="text" name="name" class="form-control" value="{{ equipment[3] }}" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning">Сохранить изменения</button>
                        <a href="{{ url_for('view_equipment', equipment_id=equipment[0]) }}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
