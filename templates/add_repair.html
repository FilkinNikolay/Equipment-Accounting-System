{% extends "base.html" %}
{% block title %}Добавить ремонт{% endblock %}
{% block content %}
<h2>🔧 Добавить запись о ремонте</h2>
<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="mb-3"><label>Дата ремонта</label><input type="date" name="repair_date" class="form-control" required></div>
            <div class="mb-3"><label>Описание</label><textarea name="description" class="form-control" rows="3" required></textarea></div>
            <div class="mb-3"><label>Стоимость (руб.)</label><input type="number" name="cost" step="0.01" class="form-control"></div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{{ url_for('view_equipment', equipment_id=equipment[0]) }}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
