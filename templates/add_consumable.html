{% extends "base.html" %}
{% block title %}Добавить расходник{% endblock %}
{% block content %}
<h2>➕ Добавить расходный материал</h2>
<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="mb-3"><label>Название</label><input type="text" name="name" class="form-control" required></div>
            <div class="mb-3"><label>Совместимые модели</label><input type="text" name="compatible_models" class="form-control" placeholder="HP LaserJet M404dn, Brother DCP-L5500DN"></div>
            <div class="mb-3"><label>Количество</label><input type="number" name="quantity" class="form-control" required></div>
            <div class="mb-3"><label>Минимальный остаток</label><input type="number" name="min_quantity" class="form-control" value="5"></div>
            <div class="mb-3"><label>Единица измерения</label><input type="text" name="unit" class="form-control" value="шт"></div>
            <div class="mb-3"><label>Цена (руб.)</label><input type="number" step="0.01" name="price" class="form-control"></div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{{ url_for('consumables_list') }}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
